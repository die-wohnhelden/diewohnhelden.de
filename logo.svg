<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">

  <!-- Kleinstadt -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">

    <!-- Haus links -->
    <polygon points="250,120 290,85 330,120"/>
    <rect x="255" y="120" width="70" height="50"/>

    <!-- Haus Mitte -->
    <polygon points="340,110 395,70 450,110"/>
    <rect x="347" y="110" width="96" height="60"/>

    <!-- Kirchturm -->
    <rect x="470" y="85" width="30" height="85"/>
    <polygon points="485,45 465,85 505,85"/>

    <!-- Haus rechts -->
    <polygon points="520,120 555,92 590,120"/>
