<svg width="480" height="420" viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>
  </defs>

  <!-- Schwarzer Hintergrund -->
  <rect width="100%" height="100%" fill="#000000"/>

  <!-- Goldener Kreis -->
  <circle cx="240" cy="150" r="120" fill="none" stroke="url(#goldGradient)" stroke-width="12"/>

  <!-- Weißes Monogramm W -->
  <text x="50%" y="175" text-anchor="middle" font-size="150" font-family="Georgia, serif"
        fill="#ffffff" font-weight="bold">
    W
  </text>

  <!-- Schriftzug -->
  <text x="50%" y="330" text-anchor="middle" font-size="36" font-family="Arial, sans-serif"
        fill="#ffffff" font-weight="bold">
    Die Wohnhelden
  </text>

  <text x="50%" y="370" text-anchor="middle" font-size="24" font-family="Arial, sans-serif"
        fill="url(#goldGradient)">
    Kurzzeitvermietung
  </text>
</svg>
